name: misspelling-platform

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: misspell
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  db-init:
    image: mysql:8.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    command: >
      sh -c "until mysqladmin ping -hmysql -uroot -p$$MYSQL_PWD --silent; do echo waiting for mysql; sleep 2; done;
      for f in /schema/*.sql; do echo Running $$f; mysql -hmysql -uroot -D misspell < $$f; done"
    volumes:
      - ./misspelling-platform/db/init:/schema:ro
    restart: "no"

  api:
    build: ./misspelling-platform/backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen-plus}
      BAILIAN_TIMEOUT_SECONDS: ${BAILIAN_TIMEOUT_SECONDS:-8}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_TIMEOUT_SECONDS: ${TURNSTILE_TIMEOUT_SECONDS:-6}
      GBNC_BASE_URL: ${GBNC_BASE_URL:-https://books.google.com/ngrams/json}
      GBNC_TIMEOUT_SECONDS: ${GBNC_TIMEOUT_SECONDS:-10}
      GBNC_RETRIES: ${GBNC_RETRIES:-1}
      GBNC_USER_AGENT: ${GBNC_USER_AGENT:-misspelling-platform/1.0}
      ALGO_STRICT_MODE: ${ALGO_STRICT_MODE:-false}
      MISSPELL_VARIANT_DICT_PATH: ${MISSPELL_VARIANT_DICT_PATH:-/workspace-root/adversarial_advs_clean_cleaned_completion2.0.json}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - outputs:/app/outputs
      - ./:/workspace-root:ro
    restart: unless-stopped

  worker:
    build: ./misspelling-platform/backend
    command: celery -A app.celery_app worker -l INFO
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen-plus}
      BAILIAN_TIMEOUT_SECONDS: ${BAILIAN_TIMEOUT_SECONDS:-8}
      GBNC_BASE_URL: ${GBNC_BASE_URL:-https://books.google.com/ngrams/json}
      GBNC_TIMEOUT_SECONDS: ${GBNC_TIMEOUT_SECONDS:-10}
      GBNC_RETRIES: ${GBNC_RETRIES:-1}
      GBNC_USER_AGENT: ${GBNC_USER_AGENT:-misspelling-platform/1.0}
      ALGO_STRICT_MODE: ${ALGO_STRICT_MODE:-false}
      MISSPELL_VARIANT_DICT_PATH: ${MISSPELL_VARIANT_DICT_PATH:-/workspace-root/adversarial_advs_clean_cleaned_completion2.0.json}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    volumes:
      - outputs:/app/outputs
      - ./:/workspace-root:ro
    restart: unless-stopped

volumes:
  mysql_data:
  outputs:
